name: data-explorer

services:
  # ─────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine     # PostgreSQL 16 + PostGIS, ~80 MB
    container_name: dx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5432:5432"                          # expose so you can use pgAdmin/psql from host
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOG_LEVEL:    ${LOG_LEVEL}
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      # Raw input data — read-only mount used only by the `ingest` CLI command
      - ${HOST_DATA_DIR}:/data/raw:ro
    command: uvicorn data_explorer.api.main:app --host 0.0.0.0 --port 8000 --workers 2

  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: ${BACKEND_URL}
    ports:
      - "${STREAMLIT_PORT}:8501"

volumes:
  pgdata:
