# =============================================================================
# SLP framework — configuration
#
# Every parameter below appears in the paper. The comment gives the section
# and the symbol, so that what is declared in the text and what is run here
# cannot drift apart.
# =============================================================================

data:
  # Root of the monthly folders (ago24/, Ago25/, ...). Relative to slp/.
  root: "../data"
  # Analysis period. Every month found under `root` is used: the dataset spans
  # feb24 to dic25 with gaps (no dic24, feb25, apr25, mag25), and no calendar
  # year is complete. What each POD must cover is declared under preprocessing,
  # namely a minimum number of valid days and every season of the grid; the
  # period itself is not truncated to a year, which would only discard data.
  year: null                     # null -> every month available
  window: null                   # [[year, month], ...] to restrict explicitly

  # Column names as they appear in the source files. Matching is
  # case-insensitive, so 'POD' and 'pod' both work.
  meta_cols:
    pod: "POD"
    ateco: "CCATETE"          # e.g. 47.11.10, DO.01
    tariff_desc: "D_49DES"
    user_category: "FDESC"
    ateco_desc: "TATE3DES"
  meas_cols:
    pod: "POD"
    date: "DataMisura"
    power: "PotenzaContrattuale"   # null if absent; the outlier filter is then skipped
    kind: "Tipologia"              # the quantity a row records
  # Rows to keep. The file holds several quantities per POD-day:
  #   AP  active energy withdrawn      <- the consumption curve
  #   RLP inductive reactive withdrawn
  #   AN  active energy injected       <- marks a POD as a prosumer
  #   RLN, RCN  reactive injected
  # Without this filter the reactive row is read as a second day.
  keep_kind: "AP"
  # Unit of the Q columns. The export is in Wh; everything downstream is kWh.
  reading_unit: "Wh"             # Wh | kWh
  power_unit: "kW"               # kW | W
  date_format: "%d/%m/%Y"

preprocessing:                 # Section 2.2
  # Gap handling, in quarter-hours.
  gap_short_max: 4             # <= 1 h  -> linear interpolation
  gap_medium_max: 16           # <= 4 h  -> self-similarity (same QH, day type, season, same POD)
                               #  > 4 h  -> the day is discarded
  # A day needs enough non-zero quarter-hours to have a shape at all. One
  # reading in 96 is an impulse, not an operating pattern: normalised it becomes
  # a spike carrying 100% of the day, which is as far from every real form as a
  # point can be, and Ward spends whole codewords on such days. They are valid
  # observations and are kept as days, exactly like the days at zero, but they
  # do not enter the dictionary.
  min_nonzero_quarters: 12      # 2 hours out of 24
  # Zero runs, in hours. Longer runs are genuine only if calendrically coherent.
  zero_run_hours: 24
  zero_run_min_recurrences: 3  # how many coherent occurrences make a run genuine
  # Completeness thresholds. The paper asks for 82% of the year; with 304
  # calendar days available in 2024 that is 250, not 300.
  min_valid_days: 250
  require_all_seasons: true
  # Outliers: the single criterion is contractual power. Section 2.2.
  power_margin: 1.5            # a reading above margin x contractual power is a fault
  min_contractual_power: 0.1   # PODs at or below this carry no usable threshold
  # How a daily curve is turned into a shape.
  #   unit_integral  s = p / sum(p), so every shape sums to one and is a
  #                  distribution over the day. Required by Eq. 2, by the total
  #                  variation of Eq. 8, and by the comparison of Section 2.5,
  #                  where the national profiles are normalised on energy.
  #   min_max        s = (p - min) / (max - min), so every shape runs from 0 to 1
  #                  and the peak is always 1. Isolates the outline and discards
  #                  how much energy sits under the curve. Eq. 2 no longer
  #                  recomposes, the day weights of Eq. 4 lose their basis, and
  #                  the total variation is undefined; kept as an alternative to be
  #                  compared rather than argued about.
  shape_normalisation: "unit_integral"   # unit_integral | min_max
  # Compared against min_max on this dataset: unit_integral holds the wider
  # margin over the mean curves (8.6x against 3.3x). min_max separates the
  # users no better and lifts the rival, since stretching every curve to
  # full scale makes the mean curves more distinguishable too.
  # Day types and seasons. The grid of Section 2.4 is built on these.
  seasons:                     # month -> season label
    winter: [11, 12, 1, 2, 3]
    mid:    [4, 5, 10]
    summer: [6, 7, 8, 9]
  # Italian national holidays are treated as Sunday.
  holidays_as_sunday: true

clustering:                    # Section 2.3
  # How the dictionary is built. Ward needs the distance between every pair of
  # shapes, which is quadratic in memory: on 2.5M shapes that is tens of TB.
  #   summarised_ward  every shape is summarised, in one linear pass of
  #                    mini-batch k-means, into n_micro micro-clusters; Ward then
  #                    runs on those, weighted by cardinality. Every shape takes
  #                    part, and the memory Ward needs is n_micro^2, known in
  #                    advance.                                          [default]
  #   sample_ward      Ward on a stratified sample of `sample_size`, the rest
  #                    assigned by nearest centroid. Kept for comparison.
  #   minibatch        exploratory only; the paper declares Ward.
  # Over what the dictionary is built.
  #   global      one vocabulary for every day of the year.
  #   per_season  one vocabulary per season, and the frequency vector carries
  #               D coordinates per season rather than D in all.
  #
  # The distinction is not cosmetic. Shapes are normalised to unit integral, so a
  # flat winter day and a flat summer day are the same shape: what separates them
  # is the day weight, not the curve. Under a global dictionary they land in one
  # codeword and their frequencies add up, and the seasonality is lost from the
  # vector, surviving only in the seasonal_amplitude feature. Per season it
  # becomes a coordinate of its own.
  # The price is D coordinates per season instead of D: more structural zeros,
  # which is the ground on which D=20 collapsed.
  dictionary_scope: "global"     # global | per_season
  # The unit of observation of the first stage.
  #   day    every POD-day is one shape. The mixture of days is what the second
  #          stage reads, and it is what an average destroys.        [default]
  #   month  every POD-month is one shape, the energy-weighted mean of its days.
  #          The dictionary is built on smoother curves, but weekday and weekend
  #          are averaged together inside it and the intra-month mixture is gone;
  #          what survives is seasonality, which the scale features already carry.
  #          Each user then distributes 18 months rather than 546 days.
  # Generation (Section 2.4) is unaffected either way: it averages the metered
  # days over the regulatory grid regardless of what the dictionary was built on.
  shape_unit: "day"            # day | month
  dictionary_method: "summarised_ward"
  n_micro: 4000               # Ward on 4000 points needs ~0.06 GB; 10000 needs ~0.4
  batch_size: 50000            # rows per pass of the summariser
  sample_size: 20000           # [M], used only by sample_ward
  # [D]. Fixed rather than left to the silhouette, which grows with D almost
  # monotonically and is in any case computed on the micro-clusters, already
  # compact by construction: it indicates, it does not decide. The paper's third
  # criterion rules here, that every codeword admit a verbal description, and it
  # is read off dictionary.png. Set to null to let the silhouette choose.
  # Section 2.3. D is chosen on the quantization error of the dictionary: the
  # smallest D beyond which no further codeword reduces it by d_tol or more, with
  # every codeword holding at least d_min_share of the days. The silhouette is
  # reported in validity_D.csv and does not decide. An integer here forces D.
  n_codewords: null
  d_tol: 0.01
  d_min_share: 0.005
  dictionary_resolution: "quarter_hourly"  # hourly | quarter_hourly
  codewords_range: [2, 30]      # the range searched and reported in validity_D.csv
  replicas: 10                 # [R]
  # delta, CLR. The paper asks for a threshold below the resolution of the
  # day weights, which is 1/n_days ~ 0.002 over this period. Tested from
  # 1e-6 to 2e-3. The user partition is sensitive to it (ARI against the base
  # partition between 0.36 and 0.46 in the September 2026 run), since most
  # users realise only part of the dictionary; Section 3.5 reports it.
  zero_replacement: 1.0e-4     # delta, CLR
  # Section 3.5. The user partition is rebuilt at the selected K for every value
  # below and compared with the base partition through the ARI. The dictionary
  # is not rebuilt, so only the second stage is being tested.
  sensitivity_zero_replacement: [1.0e-6, 1.0e-5, 1.0e-3, 2.0e-3]
  sensitivity_scale_weight: [0.0, 0.25, 0.75]
  # lambda. The weight of the temporal-allocation features (load factor, log
  # peak-to-average, weekday contrast, seasonal amplitude, zero-day fraction)
  # against the mixture of forms. None of them depends on the size of the user,
  # so lambda balances two descriptions of behaviour and never behaviour against
  # magnitude. What settles the balance is not lambda alone but
  # the variance each block carries, and the CLR block loses its variance
  # when one form dominates the population. The run prints both.
  scale_weight: 0.50            # lambda
  # Section 2.3. K is searched over an admissible range of resolutions. The lower
  # bound is a requirement of the use: a catalogue coarser than six profiles merges
  # users the national frameworks already keep apart (residency and power within the
  # domestic category, other uses and public lighting outside it), and at K = 3 it
  # misallocated more portfolio energy than the ARERA catalogue. The upper bound
  # exceeds the 19 national profiles the catalogue is compared with. Within the range,
  # K is the largest value up to which every partition reproduces itself at mean
  # ARI >= k_stability (0.65, Steinley 2004); when no K of the range reaches it, the
  # most stable admissible K is taken and its ARI is reported. An integer forces K.
  n_profiles: null
  profiles_range: [6, 20]
  # The stability of the partition across subsamples is computed at every K of
  # the range even when K is fixed, since Section 2.3 reports it for the adopted
  # value together with its weakness.
  k_stability_report: true
  k_stability: 0.65
  k_max_small_share: 0.01
  k_n_boot: 20
  k_frac: 0.8
  min_group_size: null         # [n_min]; null -> max(30, 3K)
  random_state: 42
  fast: false                  # true -> MiniBatchKMeans while exploring, Ward for the final run

labels:                        # Section 2.2 / 2.6
  # WARNING: in this dataset the DB-style column names do not match NACE levels.
  #   ateco_l1 = 2 digits  = NACE Division   <- the paper's "division level"
  #   ateco_l2 = 4 digits  = NACE Class
  #   ateco_l3 = 6 digits  = NACE Subcategory
  level: 1                     # 1 -> division (base case, matches the paper)
  sensitivity_level: 2         # 2 -> class
  # Divisions below max(min_class_size, multiple x K), K being the number of
  # published profiles, are pooled into a single class of minor divisions and are
  # not discarded. mapping.py reads these two values and nothing else.
  min_class_size: 25
  min_class_multiple_of_k: 3
  # Domestic codes. In this dataset the mapping is inverted w.r.t. expectation.
  domestic:
    "DO.01": "Non Residente"
    "DO.02": "Residente"

generation:                    # Section 2.4
  normalise_kwh_year: 1000
  grid: season                 # season (default) or month
  # How the days of the members are averaged within a cell of the grid.
  #   energy  each quarter-hour of the cell curve is the energy withdrawn by the
  #           members in that quarter-hour over the energy of the cell, which is
  #           the normalised aggregate curve of the group. It is the same
  #           aggregation the cell weights are built on, so curve and weight
  #           describe one object, and a portfolio settled on the profile is
  #           unbiased in every cell.                             [default]
  #   day     unweighted mean of the unit-integral day shapes, so a day of a few
  #           kWh counts as much as a day of a few hundred. Kept for comparison.
  curve_weighting: energy

comparison:                    # Section 2.5
  reference_year: 2025         # the year of the GSE workbook and of the calendar
  time_bands: "arera"          # F1/F2/F3 as defined by ARERA
  # A data-driven profile counts as residential when at least this share of its
  # points carries a domestic activity label (DO.*). The same label defines the
  # domestic class of Section 2.6, so the two sections cannot disagree.
  residential_threshold: 0.80
  # Eq. 14. Hourly or quarter-hourly price series in EUR/MWh, relative to slp/.
  # CSV with a timestamp column (local time, start of the interval) and a price
  # column; quarter-hourly values are averaged to the hour. Without a file the
  # cost is not computed and numerical_results.csv says so: a constant price
  # would return zero by construction, since the signed discrepancy of each
  # user-month sums to zero.
  price_file: null             # e.g. "../data/prices/pz_nord_2025.csv"
  price_timestamp_column: "timestamp"
  price_value_column: "price_EUR_MWh"
  price_label: "day-ahead zonal price, North zone"
  imbalance_price_file: null   # same format; optional second valuation

mapping:                       # Section 2.6
  n_bootstrap: 500
  # Permutations of the activity labels behind the reference distribution of M1:
  # for a class of n points, the effective number of profiles spanned by n points
  # drawn at random from the whole population. It carries the small-sample bias
  # of the entropy, which the analytical reference exp(H(A)) does not.
  null_permutations: 1000
  # Section 3.5: the mapping is recomputed on the same tree cut at K + offset.
  # Offsets of K explored on the same tree; values below K = 2 are skipped.
  sensitivity_k_offsets: [-2, -1, 1, 2, 3, 4, 5]

output:
  cache_dir: "cache"
  results_dir: "paper_results"
  figure_format: "png"
  figure_dpi: 300
