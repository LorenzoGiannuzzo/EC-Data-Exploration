# Add this block to config.yaml, just above the 'output:' section.
# For the valuation (table_a3), also set comparison.price_file and, optionally,
# comparison.imbalance_price_file to the CSV files written by prepare_prices.py.

extensions:                    # tables completing Section 3, python main.py --stage extensions
  n_folds: 5                   # out-of-sample validation: folds of users
  information_permutations: 1000
  quarter_hourly_sample_pods: 1000   # domestic points on which the 15-minute error is computed
  dispersion_max_days_per_cell: 2000
  # Optional: ARERA conventional load profiling coefficients, CSV with the columns
  # profile, F1, F2, F3 (shares or energies per band), relative to slp/
  tilp_file: null
  # Optional: national figures the dataset is compared with in table_a11. Leave a
  # value null when the figure is not available. Source: ARERA, Relazione annuale.
  national_reference:
    source: null
    share_domestic: null
    share_resident: null
    share_prosumer: null
    share_power_0-1.5: null
    share_power_1.5-3: null
    share_power_3-4.5: null
    share_power_4.5-6: null
    share_power_>6: null
    median_kwh_resident: null
    median_kwh_nonresident: null
    median_kwh_other: null
