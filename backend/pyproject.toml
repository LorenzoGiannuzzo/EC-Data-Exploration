[project]
name = "data-explorer-backend"
version = "0.1.0"
description = "Electrical load profile analysis — business + API + CLI"
requires-python = ">=3.12"
authors = [{ name = "Lorenzo Giannuzzo", email = "lorenzo.giannuzzo@polito.it" }]

dependencies = [
    # ── Web layer ───────────────────────────────────────────────────────
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # ── Database ────────────────────────────────────────────────────────
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",       # PostgreSQL driver
    "geoalchemy2>=0.15",          # PostGIS bindings
    "alembic>=1.13",
    # ── CLI ─────────────────────────────────────────────────────────────
    "typer>=0.12",
    "rich>=13.9",                 # nice terminal output
    # ── Data / analytics (same versions as the original dashboard) ──────
    "numpy>=1.26",
    "pandas>=2.2",
    "polars>=1.0",
    "pyarrow>=15.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
data-explorer = "data_explorer.cli.main:app"

[build-system]
requires      = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length    = 100
target-version = "py312"
